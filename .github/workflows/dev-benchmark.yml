name: Dev Benchmark APK

on:
  push:
    branches: [automix-fix]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-dev-benchmark:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Dev Benchmark APK
      run: ./gradlew :app:assembleDevBenchmark

    - name: Show built APK
      run: ls -la app/build/outputs/apk/dev/benchmark/

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: bitchord-dev-benchmark
        path: app/build/outputs/apk/dev/benchmark/*.apk
        compression-level: 0

    - name: Publish APK as a release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        APK=$(ls app/build/outputs/apk/dev/benchmark/*.apk | head -n 1)
        cp "$APK" bitchord-dev.apk
        gh release delete dev-build --yes --cleanup-tag -R "${{ github.repository }}" || true
        gh release create dev-build bitchord-dev.apk -R "${{ github.repository }}" --target "${{ github.sha }}" --prerelease --title "Dev build" --notes "Automix fix build, commit ${{ github.sha }}"
